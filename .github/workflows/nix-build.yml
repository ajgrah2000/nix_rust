name: "Nix Build Rust Sega and Atari"

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AUTO_TAG_NAME: ${{ github.ref_name }}_${{ github.sha }}

permissions:
  contents: write

jobs:

  build:
    name: Build (${{ matrix.target }} - ${{ matrix.platform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [rustsega, rusted_atari2600]
        platform: [emscripten, windows]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-nix-config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://cache.nixos.org/

      - name: Build with Nix
        run: |
          rm -f rust_${{ matrix.target }}/flake.lock
          cd rust_${{ matrix.target }}
          nix build .#${{ matrix.platform }} --option sandbox false

      - name: Package artifact
        run: |
          mkdir -p out
          if [ "${{ matrix.platform }}" = "emscripten" ]; then
            zip -r out/${{ matrix.target }}_emscripten.zip result/website/
          else
            zip -j out/${{ matrix.target }}_windows.zip result/x86_64-pc-windows-gnu/*/bin/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}_${{ matrix.platform }}_${{ env.AUTO_TAG_NAME }}
          path: out/*.zip


  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.AUTO_TAG_NAME }}" --title "${{ env.AUTO_TAG_NAME }}" --notes "Automated release"


  upload_assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build, create_release]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in artifacts/**/*.zip; do
            echo "Uploading $f"
            gh release upload "${{ env.AUTO_TAG_NAME }}" "$f"
          done

