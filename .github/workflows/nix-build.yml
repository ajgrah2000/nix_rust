name: "Nix Build Rust Sega and Atari"

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AUTO_TAG_NAME: ${{ github.ref_name }}_${{ github.sha }}

permissions:
  contents: write

jobs:

  build:
    name: Build all targets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-nix-config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://cache.nixos.org/

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
            /nix/var/nix/gcroots
          key: nix-deps-${{ hashFiles('flake.lock', 'rust_nightly/flake.lock') }}
          restore-keys: nix-deps-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
            /nix/var/nix/gcroots
          key: nix-sources-${{ hashFiles('rust_rustsega/flake.lock', 'rust_rusted_atari2600/flake.lock') }}
          restore-keys: nix-sources-

      - name: Build all targets
        run: |
          mkdir -p results
          (cd rust_rustsega && nix build .#windows --option sandbox false -o ../results/rustsega-windows)
          (cd rust_rustsega && nix build .#emscripten --option sandbox false -o ../results/rustsega-emscripten)
          (cd rust_rusted_atari2600 && nix build .#windows --option sandbox false -o ../results/rusted_atari2600-windows)
          (cd rust_rusted_atari2600 && nix build .#emscripten --option sandbox false -o ../results/rusted_atari2600-emscripten)

      - uses: actions/upload-artifact@v4
        with:
          name: nix-builds
          path: results/

  package:
    name: Package (${{ matrix.target }} - ${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rustsega, rusted_atari2600]
        platform: [emscripten, windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nix-builds

      - name: Package artifact
        run: |
          mkdir -p out
          if [ "${{ matrix.platform }}" = "emscripten" ]; then
            zip -r out/${{ matrix.target }}_emscripten.zip results/${{ matrix.target }}-emscripten/website/
          else
            zip -j out/${{ matrix.target }}_windows.zip results/${{ matrix.target }}-windows/x86_64-pc-windows-gnu/*/bin/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}_${{ matrix.platform }}_${{ env.AUTO_TAG_NAME }}
          path: out/*.zip

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')

    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.AUTO_TAG_NAME }}" --title "${{ env.AUTO_TAG_NAME }}" --notes "Automated release"

  upload_assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [package, create_release]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in artifacts/**/*.zip; do
            echo "Uploading $f"
            gh release upload "${{ env.AUTO_TAG_NAME }}" "$f"
          done

