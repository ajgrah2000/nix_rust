name: "Nix Build Rust Sega and Atari"

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AUTO_TAG_NAME: ${{ github.ref_name }}_${{ github.sha }}

permissions:
  contents: write
  id-token: write
  pages: write

jobs:

  build:
    name: Build all targets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-nix-config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://cache.nixos.org/

      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Build all targets
        run: |
          mkdir -p results
          (cd rust_rustsega && nix build .#windows --option sandbox false -o ../results/rustsega-windows)
          (cd rust_rustsega && nix build .#emscripten --option sandbox false -o ../results/rustsega-emscripten)
          (cd rust_rusted_atari2600 && nix build .#windows --option sandbox false -o ../results/rusted_atari2600-windows)
          (cd rust_rusted_atari2600 && nix build .#emscripten --option sandbox false -o ../results/rusted_atari2600-emscripten)

      - uses: actions/upload-artifact@v4
        with:
          name: nix-builds
          path: results/

  package:
    name: Package (${{ matrix.target }} - ${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rustsega, rusted_atari2600]
        platform: [emscripten, windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nix-builds

      - name: Package artifact
        run: |
          mkdir -p out
          if [ "${{ matrix.platform }}" = "emscripten" ]; then
            SOURCE_DIR=$(ls -d ${{ matrix.target }}-emscripten/website/*/)
            zip -r out/${{ matrix.target }}_emscripten.zip "$SOURCE_DIR"
          else
            SOURCE_DIR=$(ls -d ${{ matrix.target }}-windows/x86_64-pc-windows-gnu/rust_${{ matrix.target }}/*/)
            zip -j -r out/${{ matrix.target }}_windows.zip "$SOURCE_DIR"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}_${{ matrix.platform }}_${{ env.AUTO_TAG_NAME }}
          path: out/*.zip

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
      #    if: startsWith(github.ref, 'refs/tags/')

    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.AUTO_TAG_NAME }}" --title "${{ env.AUTO_TAG_NAME }}" --notes "Automated release"

  upload_assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [package, create_release]
      #    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in artifacts/**/*.zip; do
            echo "Uploading $f"
            gh release upload "${{ env.AUTO_TAG_NAME }}" "$f"
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
      #    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nix-builds
          path: downloads

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Create site structure
        run: |
          echo "=== Contents of downloads ==="
          ls -la downloads/
          echo ""
          
          for dir in downloads/*; do
            echo "=== $dir ==="
            ls -la "$dir"
            echo ""
          done

          mkdir -p _site/rustsega
          mkdir -p _site/rusted_atari2600

          # rustsega
          if [ -d downloads/rustsega-emscripten/website/rustsega ]; then
            cp -r downloads/rustsega-emscripten/website/rustsega/* _site/rustsega/
          elif [ -d downloads/rustsega-emscripten/website ]; then
            echo "=== rustsega-emscripten/website ==="
            ls -la downloads/rustsega-emscripten/website/
            cp -r downloads/rustsega-emscripten/website/* _site/rustsega/
          else
            echo "Warning: rustsega emscripten build not found"
          fi
          
          # rusted_atari2600
          if [ -d downloads/rusted_atari2600-emscripten/website/rusted_atari2600 ]; then
            cp -r downloads/rusted_atari2600-emscripten/website/rusted_atari2600/* _site/rusted_atari2600/
          elif [ -d downloads/rusted_atari2600-emscripten/website ]; then
            cp -r downloads/rusted_atari2600-emscripten/website/* _site/rusted_atari2600/
          else
            echo "Warning: rusted_atari2600 emscripten build not found"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

